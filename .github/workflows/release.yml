# NuGet Trusted Publishing 发布工作流
# 参考：https://learn.microsoft.com/nuget/nuget-org/trusted-publishing

name: Publish to NuGet

on:
  # 推送 tag 触发发布：vx.y.z 或 x.y.z
  # 开发/预发布 tag 不会触发发布
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  # 手动触发：须在输入框中指定版本号
  workflow_dispatch:
    inputs:
      version:
        description: '与源码三段版本号一致的 NuGet 版本，如 3.0.0 或 3.0.0-rc.1'
        required: true
        type: string

jobs:
  publish:
    name: Pack & Publish to NuGet
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          SOURCE_VERSION_PREFIX="$(dotnet msbuild src/FunGame.Core.csproj -getProperty:VersionPrefix -verbosity:quiet)"
          export SOURCE_VERSION_PREFIX
          bash .github/scripts/resolve-release-version.sh

      - name: Check NuGet user
        if: steps.version.outputs.skipped != 'true'
        shell: bash
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo '请先设置仓库变量 NUGET_USER，值为 nuget.org 用户名（不是邮箱）。' >&2
            exit 1
          fi

      - name: Restore dependencies
        if: steps.version.outputs.skipped != 'true'
        run: dotnet restore FunGame.Core.slnx

      - name: Build
        if: steps.version.outputs.skipped != 'true'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build FunGame.Core.slnx --no-restore --configuration Release -p:Version="$PACKAGE_VERSION"

      - name: Unit tests
        if: steps.version.outputs.skipped != 'true'
        run: dotnet test FunGame.Core.slnx --no-build --no-restore --configuration Release --verbosity normal

      - name: Pack
        if: steps.version.outputs.skipped != 'true'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/FunGame.Core.csproj --no-restore --no-build --configuration Release -o ./nupkg -p:Version="$PACKAGE_VERSION"

      - name: NuGet login
        if: steps.version.outputs.skipped != 'true'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push to NuGet
        if: steps.version.outputs.skipped != 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
